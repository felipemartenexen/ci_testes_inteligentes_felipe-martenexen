name: CI - Testes Manuais

# Gatilhos: push em qualquer branch que NÃO seja main/master, e PR contra main.
on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: {}

# Cancela execuções em andamento quando há novo push na mesma branch.
concurrency:
  group: ci-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes-manuais:
    name: Testes Manuais (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (com cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Cache de browsers do Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar browsers do Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Instalar dependências do sistema (caso cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Executar testes MANUAIS
        id: run-tests
        run: npm run test:manual
        env:
          CI: 'true'

      - name: Marcar status final
        if: always()
        run: |
          if [ "${{ steps.run-tests.outcome }}" = "success" ]; then
            echo "::notice title=Resultado::PASSED — Todos os testes manuais passaram"
          else
            echo "::error title=Resultado::FAILED — Há testes manuais falhando"
          fi

      - name: Upload do relatório HTML (Playwright)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-manual
          path: playwright-report/
          retention-days: 7

      - name: Upload de screenshots/videos de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-manual
          path: |
            test-results/
          retention-days: 7
